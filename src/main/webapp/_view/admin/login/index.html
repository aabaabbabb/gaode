<!doctype html>
<html  class="x-admin-sm">
<head>
	<meta charset="UTF-8">
	<title>酒店预订系统</title>
	<meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,user-scalable=yes, minimum-scale=0.4, initial-scale=0.8,target-densitydpi=low-dpi" />
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <link rel="stylesheet" href="/assets/css/font.css">
    <link rel="stylesheet" href="/assets/css/login.css">
	  <link rel="stylesheet" href="/assets/css/xadmin.css">
    <script type="text/javascript" src="/assets/lib/jquery/jquery.min-3.2.1.js"></script>
    <script src="/assets/lib/layui/layui.js" charset="utf-8"></script>
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>
<body class="login-bg">
    
    <div class="login layui-anim layui-anim-up">
        <div class="message">酒店预订系统登录</div>
        <div id="darkbannerwrap"></div>
        
        <form method="post" class="layui-form" >
            <input name="userName"  placeholder="手机号"  type="text"  class="layui-input"  lay-verify="userName">
            <hr class="hr15">
            <input name="password" lay-verify="password" placeholder="密码"  type="password" class="layui-input">
            <hr class="hr15">
            <input name="captcha" lay-verify="captcha" placeholder="请输入验证码"  type="text" class="layui-input" style="float:left;width: 50%">
            <img title="点击刷新" onclick="updateCaptcha(this,'captchaInput')" id="captchaImg" style="float:left; margin-left:20px; margin-top:5px" src="/admin/captcha"/>
            <hr class="hr15">
             <div class="layui-input-block" style="float:left;margin-left:1px">
      			<input type="checkbox" name="keepLogin" lay-skin="primary" title="保持登录" checked="checked" value="1" >
      			<label for="keepLogin" style="cursor: pointer;"><span style='color:#A00;'>(勿在公用电脑上使用)</span></label>
    	    </div>  
            <input value="登录" lay-submit lay-filter="login" style="width:100%;" type="submit">
            <hr class="hr20" >
        </form>
    </div>

    <script>
    var captchaImg = $("#captchaImg");
	var captchaInputId = "captchaInput";
        $(function  () {
            layui.use('form', function(){
              var form = layui.form;
              form.verify({
          	    userName: function(value){
          	      if(value.length < 5){
          	        return '请输入手机号';
          	      }
          	    }
          	    ,password: [
          	      /^[\S]{6,12}$/
          	      ,'密码必须6到12位，且不能出现空格'
          	    ]
          	    ,captcha: [
            	      /^[\S]{4,4}$/
            	      ,'请输入4位验证码'
            	    ]
          	  });
              // layer.msg('玩命卖萌中', function(){
              //   //关闭后的操作
              //   });
              //监听提交
              form.on('submit(login)', function(data){
            	  $.ajax({
            		  url:'/admin/doLogin?returnUrl=#(returnUrl)',
            		  method:'post',
            		  data:data.field,        
                      dataType:'JSON',  
                      success(ret){
                          console.log(ret);
                    	// 业务层验证成功
      					if(ret.state == "ok") {
      						location.href = ret.returnUrl;
      						return ;
      					}
                    	
      				    // 业务层验证失败
    					if (ret.state == "fail") {
    						layer.msg(ret.msg, {
    									shift: 6
    									, shade: 0.3
    									, time: 2500
    									, offset: "165px"
    									, closeBtn: 1
    									, shadeClose: true
    								} , function() {
    									updateCaptcha(captchaImg, captchaInputId);
    								}
    						);
    						return ;
    					}
    					// Validator 层验证失败
    					if (ret.userNameMsg) {
    						layer.msg(ret.userNameMsg);
    					}
    					if (ret.passwordMsg) {
    						layer.msg(ret.passwordMsg);
    					}                  	  
                    	if (ret.captchaMsg) {
      						updateCaptcha();    // captcha 被验证过以后会立即失效，更新之
      						layer.msg(ret.captchaMsg);
      					}
                      }
            	  		, error: function(ret) { }              // ret.status != 200 时回调
  						, complete: function(ret) { }       // 无论是 success 还是 error，最终都会被回调
            	  });
               // layer.msg(JSON.stringify(data.field),function(){
               //     location.href='index.html'
               // });
                return false;
              });
            });
        })
        /**
 * 刷新验证码
 */
function updateCaptcha(img, inputId) {
	var src = "/admin/captcha?v=" + Math.random();
	if (img.src) {		// 支持传入 this
		img.src = src;
	} else {			// 支持传入 jquery 对象
		img.attr("src", src);
	}
	$("#" + inputId).val("");
}
    </script>
    <!-- 底部结束 -->
</body>
</html>
